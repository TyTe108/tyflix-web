    <!-- Home-screen install. The manifest is the whole reason Chrome offers
         "Install app" instead of a plain "Add to Home screen" bookmark, and
         it's where Android reads the launcher icon from. Without it Chrome
         has no icon to use and generates a letter tile from <title> instead.
         Every icon the manifest lists has to actually exist in web/public/ or
         Chrome reports an installability error and refuses to install, so
         don't ship this until the PNGs are in place. Vite copies web/public/
         to the dist root at build time, and express.static serves it
         unauthenticated ahead of the SPA fallback (see server/src/index.ts),
         which is what lets Chrome fetch the manifest while logged out. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS reads this rather than the manifest icons for its home screen, so
         it stays even though Android doesn't need it. Status bar is "black"
         and not "black-translucent" on purpose: styles.css only compensates
         for safe-area-inset-bottom, so a translucent bar would let the header
         slide up under the clock. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Deprecated in favour of the manifest's display mode, and kept anyway on
         purpose. Apple documents that apple-mobile-web-app-status-bar-style "has
         no effect unless you first specify full-screen mode" with this tag, and
         the startup images below are widely reported to need it too. Before this
         was added, the status-bar line right below was inert. The manifest is
         still what puts us in standalone; this only unlocks the two Apple-only
         features, and non-Apple browsers ignore it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tyflix" />

    <!-- iOS launch screens. Android generates a splash from the manifest's
         background_color; iOS does not support background_color at all and shows
         a WHITE flash unless a startup image matches the device exactly, which is
         why there are 40 files for 20 device classes. Generated from the icon
         glyph on #0e1013 by script, palette-quantised to 8 colours (~13 KB each,
         visually identical to full RGB at 1.3/255 MAE over the glyph).

         Three traps if you regenerate these:
         1. Landscape entries deliberately carry the PORTRAIT device-width and
            device-height, differing only by `orientation`. That reads as a bug and
            is correct - Apple matches the physical screen, not the rotation.
         2. device-width/height are CSS px (device px / DPR), and 414x896 exists at
            BOTH dpr 2 and dpr 3, so -webkit-device-pixel-ratio is load-bearing.
         3. The device matrix goes stale as Apple ships hardware. This set came from
            pwa-asset-generator 8.1.5 (covers through iPhone 17 / iPhone Air); a
            newer phone with a new logical size falls back to the white flash. -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-640-1136.png"
          media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
